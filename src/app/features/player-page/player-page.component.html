<div class="page" *ngIf="player$ | async as player; else loading">

  <!-- HEADER -->
  <app-player-header [player]="player"></app-player-header>

  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <app-player-ranks [player]="player"></app-player-ranks>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <nav class="sub-nav">
        <a routerLink="stats" routerLinkActive="active">Stats</a>
        <a routerLink="graphs" routerLinkActive="active">Graphs</a>
        <a routerLink="weapons" routerLinkActive="active">Weapons</a>
        <a routerLink="maps" routerLinkActive="active">Maps</a>
        <a routerLink="matches" routerLinkActive="active">Matches</a>
        <a routerLink="teammates" routerLinkActive="active">Players</a>
      </nav>

      <router-outlet></router-outlet>

    </div>
  </div>
</div>

<ng-template #loading>
  <div class="loading">Loading player...</div>
</ng-template>
